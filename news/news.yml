# All news items, newest first. news/index.qmd shows them in full and the home
# page shows the latest three, both through the templates in this folder.
#
# Fields:
#   id           anchor on the News page (news/#id)
#   title        headline
#   date         YYYY-MM-DD (shown as month and year)
#   href         primary source; the headline links here. Leave out if there's
#                no outside source, and the headline won't be a link.
#   description  one-line summary for the home page
#   body         full text for the News page (markdown). Link to site pages with
#                root-absolute paths like /matchminer-ai.html, so they work from
#                both pages.

- id: options-activate
  title: "OPTIONS-ACTIVATE launches"
  date: 2026-08-01  # Month only on purpose; the registry gives a July 20 study start, the launch was August
  href: https://clinicaltrials.gov/study/NCT07232043
  description: "A randomized study testing whether proactive AI trial suggestions help more patients reach clinical trials."
  # TODO: wording pending review before launch (see PLANNING.md).
  body: |
    Dana-Farber has launched OPTIONS-ACTIVATE, a randomized study testing whether proactive AI trial suggestions help more patients reach clinical trials.

    When [MatchMiner-AI](/matchminer-ai.html) detects that a patient's cancer is progressing, their oncologist receives an email with a ranked list of possible trials. The study compares this with standard MatchMiner-AI access. Its main measure is the share of new systemic treatments that are clinical trials.

    It builds on an [earlier Dana-Farber randomized trial](/news/#jama-2025), which found that AI could reliably spot patients likely to need a change in treatment, but that notifications about genomically matched trials alone did not raise enrollment. OPTIONS-ACTIVATE instead sends a ranked list of trials from MatchMiner-AI, drawn from the patient's whole record.

    OPTIONS-ACTIVATE is part of ACTIVATE (AI-driven Clinical-trial Trial-Information and Viability Assessment Tool for EHRs), a research program led by Kenneth Kehl, MD, MPH, and funded by the National Cancer Institute (R37 CA295653).

    [ClinicalTrials.gov NCT07232043](https://clinicaltrials.gov/study/NCT07232043) and [Dana-Farber trial listing 25-413](https://www.dana-farber.org/clinical-trials/25-413).

- id: hearst-2026
  title: "MatchMiner-AI takes second place in the 2026 Hearst Health Prize"
  date: 2026-06-01  # Month only; exact award date not confirmed
  description: "Recognition for matching patients to trials from the full medical record, with openly shared models."
  body: |
    [MatchMiner-AI](/matchminer-ai.html) took second place in the 2026 Hearst Health Prize, awarded at UCLA Health Data Day.

    The recognition highlights its approach: matching patients to trials from the full medical record, with openly shared models trained on synthetic data.

- id: matchminer-ai-launch
  title: "MatchMiner-AI goes live at Dana-Farber"
  date: 2026-02-01  # Month only; exact launch date not confirmed
  description: "Providers can now look up AI-suggested clinical trials for their patients."
  body: |
    Dana-Farber providers can now look up AI-suggested clinical trials for their patients, based on the full medical record.

    [MatchMiner-AI](/matchminer-ai.html) reads a patient's clinical notes and matches them against all open trials, not only those with genomic criteria. Each suggestion comes with a plain-language summary for the oncologist to review.

- id: jama-2025
  title: "JAMA Network Open publishes AI-triggered trial notification study"
  date: 2025-04-21
  href: https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2833029
  description: "A randomized trial of emailing oncologists about matching trials when AI detects cancer progression."
  body: |
    Our study, [Clinical Trial Notifications Triggered by Artificial Intelligence–Detected Cancer Progression](https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2833029), is out in JAMA Network Open.

    Patients often become eligible for a new trial when their cancer progresses. In this randomized trial at Dana-Farber, run from January 2023 to June 2024, AI applied to imaging reports detected likely progression, and the patient's oncologist received an email about genomically matched trials.

    The AI reliably spotted patients likely to need a new treatment, but the notifications did not increase trial enrollment. That result shaped the design of the follow-up study, [OPTIONS-ACTIVATE](/news/#options-activate).

    [Watch Ken Kehl discuss the study](https://www.youtube.com/watch?v=pGCz4cU5S6g&t=160) (JAMA Network, on YouTube).

- id: matchminer-ai-arxiv
  title: "MatchMiner-AI preprint posted on arXiv"
  date: 2024-12-23
  href: https://arxiv.org/abs/2412.17228
  description: "An open-source approach to matching people with cancer to clinical trials using language models."
  body: |
    [MatchMiner-AI: An Open-Source Solution for Cancer Clinical Trial Matching](https://arxiv.org/abs/2412.17228) is now available on arXiv.

    MatchMiner-AI extends MatchMiner beyond genomic matching. It uses language models to read the clinical record and compare patients against trial eligibility criteria as written.

- id: llama-impact-grant
  title: "MatchMiner-AI selected for a Llama Impact Grant"
  date: 2024-09-24
  href: https://ai.meta.com/blog/llama-impact-grant-innovation-award-winners-2024/
  description: "MatchMiner-AI joins the inaugural cohort of Meta's Llama Impact Grants."
  body: |
    [MatchMiner-AI](/matchminer-ai.html) was selected for the inaugural cohort of Meta's Llama Impact Grants. The grant supports development of an open-source AI platform for clinical trial matching.

    The project uses Llama models to summarize unstructured clinical notes and trial eligibility criteria, so that suitable trials can be found for each patient. The models are integrated into MatchMiner and evaluated with clinical partners.

- id: npj-2022
  title: "MatchMiner paper published in npj Precision Oncology"
  date: 2022-08-01  # TODO: confirm date; link or port the original "behind the scenes" blog post
  href: https://www.nature.com/articles/s41698-022-00312-5
  description: "Highlights from our paper describing MatchMiner's design and its adoption at Dana-Farber."
  body: |
    [MatchMiner: An open-source platform for cancer precision medicine](https://www.nature.com/articles/s41698-022-00312-5) describes how MatchMiner works and how clinicians and trial staff at Dana-Farber use it.

    By January 2022, Dana-Farber had about 170 open precision medicine trials in MatchMiner, 84% of patients had at least one trial match, and more than 220 patients had enrolled on a trial as a result of a MatchMiner match.
